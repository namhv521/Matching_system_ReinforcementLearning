name: KLTN CI

on:
  push:
    branches: [ main, KLTN ]
  pull_request:
    branches: [ main, KLTN ]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    env:
      DATA_DIR: data/public

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run Evaluation Benchmark Verification
        run: |
          python eval/run_eval.py

  frontend-test:
    name: Run Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Frontend Dependencies & Run Vitest
        run: |
          cd frontend
          npm ci
          npm run test:run
          npm run build

  container:
    name: Build deployment container
    runs-on: ubuntu-latest
    needs: [test, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kltn-matching:ci .
